# Yeni oyun haberlerini X, Reddit ve Instagram hesaplarına paylaşır.
# Şifreler: Settings → Secrets and variables → Actions (tools/sosyal_kurulum.py ekler).
# Şifresi girilmemiş hesap atlanır; hiç hesap yoksa iş boşta biter.
name: Sosyal paylasim

on:
  push:
    branches: [main]
    paths: [data/icerik.json]
  schedule:
    - cron: "17 7,10,13,16,19 * * *"   # Türkiye saatiyle 10:17, 13:17, 16:17, 19:17, 22:17
  workflow_dispatch:
    inputs:
      deneme:
        description: "Yalnız dene (hiçbir şey gönderme)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sosyal-paylasim
  cancel-in-progress: false

jobs:
  paylas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Site yayına çıksın diye bekle
        if: github.event_name == 'push'
        run: sleep 120

      - name: Paylaş
        env:
          DENEME: ${{ inputs.deneme && '--dry-run' || '' }}
          X_TR_API_KEY: ${{ secrets.X_TR_API_KEY }}
          X_TR_API_SECRET: ${{ secrets.X_TR_API_SECRET }}
          X_TR_ACCESS_TOKEN: ${{ secrets.X_TR_ACCESS_TOKEN }}
          X_TR_ACCESS_SECRET: ${{ secrets.X_TR_ACCESS_SECRET }}
          REDDIT_TR_CLIENT_ID: ${{ secrets.REDDIT_TR_CLIENT_ID }}
          REDDIT_TR_CLIENT_SECRET: ${{ secrets.REDDIT_TR_CLIENT_SECRET }}
          REDDIT_TR_USERNAME: ${{ secrets.REDDIT_TR_USERNAME }}
          REDDIT_TR_PASSWORD: ${{ secrets.REDDIT_TR_PASSWORD }}
          IG_TR_USER_ID: ${{ secrets.IG_TR_USER_ID }}
          IG_TR_TOKEN: ${{ secrets.IG_TR_TOKEN }}
          X_EN_API_KEY: ${{ secrets.X_EN_API_KEY }}
          X_EN_API_SECRET: ${{ secrets.X_EN_API_SECRET }}
          X_EN_ACCESS_TOKEN: ${{ secrets.X_EN_ACCESS_TOKEN }}
          X_EN_ACCESS_SECRET: ${{ secrets.X_EN_ACCESS_SECRET }}
          REDDIT_EN_CLIENT_ID: ${{ secrets.REDDIT_EN_CLIENT_ID }}
          REDDIT_EN_CLIENT_SECRET: ${{ secrets.REDDIT_EN_CLIENT_SECRET }}
          REDDIT_EN_USERNAME: ${{ secrets.REDDIT_EN_USERNAME }}
          REDDIT_EN_PASSWORD: ${{ secrets.REDDIT_EN_PASSWORD }}
          IG_EN_USER_ID: ${{ secrets.IG_EN_USER_ID }}
          IG_EN_TOKEN: ${{ secrets.IG_EN_TOKEN }}
          X_FR_API_KEY: ${{ secrets.X_FR_API_KEY }}
          X_FR_API_SECRET: ${{ secrets.X_FR_API_SECRET }}
          X_FR_ACCESS_TOKEN: ${{ secrets.X_FR_ACCESS_TOKEN }}
          X_FR_ACCESS_SECRET: ${{ secrets.X_FR_ACCESS_SECRET }}
          REDDIT_FR_CLIENT_ID: ${{ secrets.REDDIT_FR_CLIENT_ID }}
          REDDIT_FR_CLIENT_SECRET: ${{ secrets.REDDIT_FR_CLIENT_SECRET }}
          REDDIT_FR_USERNAME: ${{ secrets.REDDIT_FR_USERNAME }}
          REDDIT_FR_PASSWORD: ${{ secrets.REDDIT_FR_PASSWORD }}
          IG_FR_USER_ID: ${{ secrets.IG_FR_USER_ID }}
          IG_FR_TOKEN: ${{ secrets.IG_FR_TOKEN }}
          X_ES_API_KEY: ${{ secrets.X_ES_API_KEY }}
          X_ES_API_SECRET: ${{ secrets.X_ES_API_SECRET }}
          X_ES_ACCESS_TOKEN: ${{ secrets.X_ES_ACCESS_TOKEN }}
          X_ES_ACCESS_SECRET: ${{ secrets.X_ES_ACCESS_SECRET }}
          REDDIT_ES_CLIENT_ID: ${{ secrets.REDDIT_ES_CLIENT_ID }}
          REDDIT_ES_CLIENT_SECRET: ${{ secrets.REDDIT_ES_CLIENT_SECRET }}
          REDDIT_ES_USERNAME: ${{ secrets.REDDIT_ES_USERNAME }}
          REDDIT_ES_PASSWORD: ${{ secrets.REDDIT_ES_PASSWORD }}
          IG_ES_USER_ID: ${{ secrets.IG_ES_USER_ID }}
          IG_ES_TOKEN: ${{ secrets.IG_ES_TOKEN }}
        run: python tools/sosyal_yayinla.py $DENEME

      - name: Gönderi kaydını depoya yaz
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sosyal/gonderilenler.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "sosyal: gönderi kaydı"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
