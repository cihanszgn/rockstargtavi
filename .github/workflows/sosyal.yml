# Yeni oyun haberlerini X, Reddit, Instagram (görsel + Reels) ve YouTube Shorts hesaplarına paylaşır.
# Şifreler: Settings → Secrets and variables → Actions (tools/sosyal_kurulum.py ekler).
# Şifresi girilmemiş hesap atlanır; hiç hesap yoksa iş boşta biter.
name: Sosyal paylasim

on:
  push:
    branches: [main]
    paths: [data/icerik.json]
  workflow_run:
    # GITHUB_TOKEN ile yapılan push başka iş akışını tetiklemez; video hazır olunca bu iş akışı böyle uyanır
    workflows: ["Haber videosu"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "17 */2 * * *"   # İki saatte bir, UTC 17. dakika (Meta engelinden sonra temkinli tempo)
  workflow_dispatch:
    inputs:
      deneme:
        description: "Yalnız dene (hiçbir şey gönderme)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: sosyal-paylasim
  cancel-in-progress: false

jobs:
  paylas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Görsel kütüphanesi (site yeniden üretilirken kart görselleri için)
        run: python -m pip install --quiet pillow==11.3.0

      - name: Kuyruk kartlarını üret ve yayına al
        id: kart
        if: inputs.deneme != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/sosyal_derle.py --yalniz-kartlar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kart/ og.png
          if ! git diff --cached --quiet; then
            git commit -m "sosyal: saatlik kuyruk kartları"
            basarili=0
            for i in 1 2 3; do
              if git pull --rebase && git push; then basarili=1; break; fi
              sleep 5
            done
            [ "$basarili" = 1 ] || exit 1
          fi
          # GITHUB_TOKEN push'u Pages'i kendiliğinden başlatmaz.
          # Mevcut main/legacy yayınını açıkça derlet; site ayarını değiştirme.
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
          head=$(git rev-parse HEAD)
          yayinda=0
          # Başka bir oturum ya da otomasyon araya commit gönderirse en son derleme bizim HEAD'imizin
          # değil, onun üstündeki daha yeni bir commit'in olur; o da kartlarımızı içerir, geçerli sayılır.
          # Araya giren push bizim derlememizi "errored" yapabilir: bir kez yeniden derletilir.
          yeniden=0
          for i in $(seq 1 60); do
            durum=$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" --jq '.status')
            commit=$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" --jq '.commit')
            if [ "$durum" = "built" ]; then
              if [ "$commit" = "$head" ]; then yayinda=1; break; fi
              iliski=$(gh api "repos/$GITHUB_REPOSITORY/compare/$head...$commit" --jq '.status' 2>/dev/null || true)
              if [ "$iliski" = "ahead" ] || [ "$iliski" = "identical" ]; then yayinda=1; break; fi
            fi
            if [ "$durum" = "errored" ] && [ "$yeniden" = 0 ]; then
              echo "Pages derlemesi hata verdi; bir kez yeniden derletiliyor."
              gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" >/dev/null
              yeniden=1
            fi
            sleep 15
          done
          # Pages sırası dolu olabilir (art arda push'lar derlemeyi bekletir): bu arıza değil gecikmedir.
          # Tur kırmızıya düşmez; paylaşım atlanır, kuyruk bir sonraki turda gönderilir.
          if [ "$yayinda" != 1 ]; then
            echo "::warning::Kartların Pages yayını 15 dakikada doğrulanamadı (son durum: $durum); paylaşım bir sonraki tura kaldı."
            echo "yayinda=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Site yayına çıksın diye bekle (en yeni haber sayfası açılınca devam eder)
        if: (github.event_name == 'push' || github.event_name == 'workflow_run') && steps.kart.outputs.yayinda != '0'
        run: python tools/sosyal_yayinla.py --sayfa-bekle

      - name: Paylaş
        if: steps.kart.outputs.yayinda != '0'
        env:
          DENEME: ${{ inputs.deneme && '--dry-run' || '' }}
          X_TR_API_KEY: ${{ secrets.X_TR_API_KEY }}
          X_TR_API_SECRET: ${{ secrets.X_TR_API_SECRET }}
          X_TR_ACCESS_TOKEN: ${{ secrets.X_TR_ACCESS_TOKEN }}
          X_TR_ACCESS_SECRET: ${{ secrets.X_TR_ACCESS_SECRET }}
          REDDIT_TR_CLIENT_ID: ${{ secrets.REDDIT_TR_CLIENT_ID }}
          REDDIT_TR_CLIENT_SECRET: ${{ secrets.REDDIT_TR_CLIENT_SECRET }}
          REDDIT_TR_USERNAME: ${{ secrets.REDDIT_TR_USERNAME }}
          REDDIT_TR_PASSWORD: ${{ secrets.REDDIT_TR_PASSWORD }}
          IG_TR_USER_ID: ${{ secrets.IG_TR_USER_ID }}
          IG_TR_TOKEN: ${{ secrets.IG_TR_TOKEN }}
          X_EN_API_KEY: ${{ secrets.X_EN_API_KEY }}
          X_EN_API_SECRET: ${{ secrets.X_EN_API_SECRET }}
          X_EN_ACCESS_TOKEN: ${{ secrets.X_EN_ACCESS_TOKEN }}
          X_EN_ACCESS_SECRET: ${{ secrets.X_EN_ACCESS_SECRET }}
          REDDIT_EN_CLIENT_ID: ${{ secrets.REDDIT_EN_CLIENT_ID }}
          REDDIT_EN_CLIENT_SECRET: ${{ secrets.REDDIT_EN_CLIENT_SECRET }}
          REDDIT_EN_USERNAME: ${{ secrets.REDDIT_EN_USERNAME }}
          REDDIT_EN_PASSWORD: ${{ secrets.REDDIT_EN_PASSWORD }}
          IG_EN_USER_ID: ${{ secrets.IG_EN_USER_ID }}
          IG_EN_TOKEN: ${{ secrets.IG_EN_TOKEN }}
          X_FR_API_KEY: ${{ secrets.X_FR_API_KEY }}
          X_FR_API_SECRET: ${{ secrets.X_FR_API_SECRET }}
          X_FR_ACCESS_TOKEN: ${{ secrets.X_FR_ACCESS_TOKEN }}
          X_FR_ACCESS_SECRET: ${{ secrets.X_FR_ACCESS_SECRET }}
          REDDIT_FR_CLIENT_ID: ${{ secrets.REDDIT_FR_CLIENT_ID }}
          REDDIT_FR_CLIENT_SECRET: ${{ secrets.REDDIT_FR_CLIENT_SECRET }}
          REDDIT_FR_USERNAME: ${{ secrets.REDDIT_FR_USERNAME }}
          REDDIT_FR_PASSWORD: ${{ secrets.REDDIT_FR_PASSWORD }}
          IG_FR_USER_ID: ${{ secrets.IG_FR_USER_ID }}
          IG_FR_TOKEN: ${{ secrets.IG_FR_TOKEN }}
          X_ES_API_KEY: ${{ secrets.X_ES_API_KEY }}
          X_ES_API_SECRET: ${{ secrets.X_ES_API_SECRET }}
          X_ES_ACCESS_TOKEN: ${{ secrets.X_ES_ACCESS_TOKEN }}
          X_ES_ACCESS_SECRET: ${{ secrets.X_ES_ACCESS_SECRET }}
          REDDIT_ES_CLIENT_ID: ${{ secrets.REDDIT_ES_CLIENT_ID }}
          REDDIT_ES_CLIENT_SECRET: ${{ secrets.REDDIT_ES_CLIENT_SECRET }}
          REDDIT_ES_USERNAME: ${{ secrets.REDDIT_ES_USERNAME }}
          REDDIT_ES_PASSWORD: ${{ secrets.REDDIT_ES_PASSWORD }}
          IG_ES_USER_ID: ${{ secrets.IG_ES_USER_ID }}
          IG_ES_TOKEN: ${{ secrets.IG_ES_TOKEN }}
          YT_TR_CLIENT_ID: ${{ secrets.YT_TR_CLIENT_ID }}
          YT_TR_CLIENT_SECRET: ${{ secrets.YT_TR_CLIENT_SECRET }}
          YT_TR_REFRESH_TOKEN: ${{ secrets.YT_TR_REFRESH_TOKEN }}
          YT_EN_CLIENT_ID: ${{ secrets.YT_EN_CLIENT_ID }}
          YT_EN_CLIENT_SECRET: ${{ secrets.YT_EN_CLIENT_SECRET }}
          YT_EN_REFRESH_TOKEN: ${{ secrets.YT_EN_REFRESH_TOKEN }}
          YT_FR_CLIENT_ID: ${{ secrets.YT_FR_CLIENT_ID }}
          YT_FR_CLIENT_SECRET: ${{ secrets.YT_FR_CLIENT_SECRET }}
          YT_FR_REFRESH_TOKEN: ${{ secrets.YT_FR_REFRESH_TOKEN }}
          YT_ES_CLIENT_ID: ${{ secrets.YT_ES_CLIENT_ID }}
          YT_ES_CLIENT_SECRET: ${{ secrets.YT_ES_CLIENT_SECRET }}
          YT_ES_REFRESH_TOKEN: ${{ secrets.YT_ES_REFRESH_TOKEN }}
          IG_DE_USER_ID: ${{ secrets.IG_DE_USER_ID }}
          IG_DE_TOKEN: ${{ secrets.IG_DE_TOKEN }}
          YT_DE_CLIENT_ID: ${{ secrets.YT_DE_CLIENT_ID }}
          YT_DE_CLIENT_SECRET: ${{ secrets.YT_DE_CLIENT_SECRET }}
          YT_DE_REFRESH_TOKEN: ${{ secrets.YT_DE_REFRESH_TOKEN }}
          IG_NL_USER_ID: ${{ secrets.IG_NL_USER_ID }}
          IG_NL_TOKEN: ${{ secrets.IG_NL_TOKEN }}
          YT_NL_CLIENT_ID: ${{ secrets.YT_NL_CLIENT_ID }}
          YT_NL_CLIENT_SECRET: ${{ secrets.YT_NL_CLIENT_SECRET }}
          YT_NL_REFRESH_TOKEN: ${{ secrets.YT_NL_REFRESH_TOKEN }}
          IG_ZH_USER_ID: ${{ secrets.IG_ZH_USER_ID }}
          IG_ZH_TOKEN: ${{ secrets.IG_ZH_TOKEN }}
          YT_ZH_CLIENT_ID: ${{ secrets.YT_ZH_CLIENT_ID }}
          YT_ZH_CLIENT_SECRET: ${{ secrets.YT_ZH_CLIENT_SECRET }}
          YT_ZH_REFRESH_TOKEN: ${{ secrets.YT_ZH_REFRESH_TOKEN }}
        run: python tools/sosyal_yayinla.py $DENEME

      - name: Gönderi kaydını depoya yaz
        if: always() && inputs.deneme != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sosyal/gonderilenler.json 2>/dev/null || true
          if ! git diff --quiet data/videolar.json 2>/dev/null; then
            # Reels/Shorts bağlantıları manifeste yazıldı: sayfalardaki YouTube/Instagram bağlantıları için siteyi yeniden üret
            git add data/videolar.json
            python tools/site_derle.py
            python tools/sosyal_derle.py
            git add -u
          fi
          if ! git diff --cached --quiet; then
            git commit -m "sosyal: gönderi kaydı"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
