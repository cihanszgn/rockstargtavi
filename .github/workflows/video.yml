# Yeni haberler için dikey haber videosu üretir (Hyperframes + Azure Speech; habere özel tema), sunucuya yükler,
# data/videolar.json'a yazar. Eski Remotion yolu yalnız yerelde `--motor remotion` ile kalır (burada kurulmaz). Hesap/anahtar yoksa iş temiz biçimde boşta biter.
# Dört dil (tr en es fr) sırayla işlenir; günlük kota dil başınadır. Bir dilin hatası diğerlerini durdurmaz,
# iş sonunda hata olarak raporlanır (manifest ve site yine de yazılır).
# Gerekli sırlar: AZURE_SPEECH_KEY, AZURE_SPEECH_REGION, MEDYA_SSH_KEY, MEDYA_SSH_BILINEN (known_hosts satırı).
name: Haber videosu

on:
  push:
    branches: [main]
    paths: [data/icerik.json, 'video/senaryo/**']
  workflow_dispatch:
    inputs:
      deneme:
        description: "Yalnız dene (bekleyenleri listele, video üretme)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: video-uretim
  cancel-in-progress: false

env:
  GUNLUK_EN_FAZLA: "4"   # günde en çok bu kadar video, HER DİL İÇİN ayrı (üretim maliyeti ve "toplu içerik" riski için)
  DILLER: "tr en es fr"
  HF_SURUMU: "0.9.56"   # tools/video_hf.py HF_SURUMU ile aynı; sürüm değişince ikisi birlikte güncellenir
  HYPERFRAMES_NO_TELEMETRY: "1"
  DO_NOT_TRACK: "1"

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 150   # video başına ~3,5 dk; 45 dk'da iş kesiliyor ve manifest yazılmadan bütün üretim boşa gidiyordu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Görsel kütüphanesi (site yeniden üretilirken kart görselleri için)
        run: python -m pip install --quiet pillow==11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Anahtarlar var mı
        id: kontrol
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          MEDYA_SSH_KEY: ${{ secrets.MEDYA_SSH_KEY }}
        run: |
          # Ses yolu sosyal/ayarlar.json içinden okunur: "edge" anahtar istemez, "azure" iki anahtar ister.
          ses=$(python -c "import json;print((json.load(open('sosyal/ayarlar.json',encoding='utf-8')).get('video') or {}).get('ses') or 'azure')")
          echo "Ses yolu: $ses"
          if [ -z "$MEDYA_SSH_KEY" ]; then
            echo "hazir=false" >> "$GITHUB_OUTPUT"
            echo "Sunucu anahtarı girilmemiş: video üretimi atlandı (hata değil)."
          elif [ "$ses" = "azure" ] && { [ -z "$AZURE_SPEECH_KEY" ] || [ -z "$AZURE_SPEECH_REGION" ]; }; then
            echo "hazir=false" >> "$GITHUB_OUTPUT"
            echo "Azure Speech anahtarı girilmemiş: video üretimi atlandı (hata değil)."
          else
            echo "hazir=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v5
        if: steps.kontrol.outputs.hazir == 'true' && inputs.deneme != true

      - name: Bekleyenleri listele (dil dil)
        id: bekleyen
        run: |
          # Her satır "<haber id> <dil>". Bir dilin listelenememesi diğerlerini durdurmaz; hata iş sonunda raporlanır.
          : > bekleyen.txt
          hata=0
          for dil in $DILLER; do
            if ! python tools/video_uret.py bekleyenler --dil "$dil" --arsiv > "bekleyen-$dil.txt"; then
              echo "::error::Bekleyenler listelenemedi: $dil"
              hata=1
            fi
            while read -r id _; do
              [ -z "$id" ] && continue
              case "$id" in \#*) continue;; esac
              echo "$id $dil" >> bekleyen.txt
            done < "bekleyen-$dil.txt"
          done
          cat bekleyen.txt
          echo "sayi=$(grep -cv -e '^\s*$' -e '^#' bekleyen.txt || true)" >> "$GITHUB_OUTPUT"
          [ "$hata" = 0 ] || echo "liste_hatasi=1" >> "$GITHUB_OUTPUT"

      - name: Hyperframes, Chrome ve ffmpeg kur
        if: steps.kontrol.outputs.hazir == 'true' && inputs.deneme != true
        run: |
          # Yalnız yerel çizim komutları kullanılır (render, snapshot, browser); publish/share/cloud/auth/templates/billing
          # HeyGen'e içerik gönderir, çağrılmaz. Yazı tipleri depoda (video-hf/assets/fonts), sistem fontu gerekmez.
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libnss3 libgbm1 libatk1.0-0 libatk-bridge2.0-0 libcups2 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxrandr2 libpango-1.0-0 libasound2t64
          npm install -g "hyperframes@${HF_SURUMU}"
          hyperframes --version
          hyperframes browser ensure
          ffmpeg -version | head -1

      - name: SSH anahtarını hazırla
        if: steps.kontrol.outputs.hazir == 'true' && inputs.deneme != true
        env:
          MEDYA_SSH_KEY: ${{ secrets.MEDYA_SSH_KEY }}
          MEDYA_SSH_BILINEN: ${{ secrets.MEDYA_SSH_BILINEN }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$MEDYA_SSH_KEY" > ~/.ssh/medya_anahtar
          chmod 600 ~/.ssh/medya_anahtar
          printf '%s\n' "$MEDYA_SSH_BILINEN" > ~/.ssh/known_hosts
          # scp anahtarı kendisi bulsun: yalnız medya sunucusu için bu anahtar kullanılır
          printf 'Host medya.ctrl-agame.com\n  IdentityFile ~/.ssh/medya_anahtar\n  IdentitiesOnly yes\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Videoları üret ve yükle (dil başına günlük sınıra kadar)
        if: steps.kontrol.outputs.hazir == 'true' && inputs.deneme != true
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          LISTE_HATASI: ${{ steps.bekleyen.outputs.liste_hatasi }}
        run: |
          # bekleyen.txt: her satır "<haber id> <dil>"; # ile başlayan ve boş satırlar yok sayılır.
          # Günlük kota her dil için ayrı sayılır; bir videonun hatası kaydedilir, sonraki işe geçilir, sonda iş hata verir.
          declare -A yapilan
          hatalar=()
          [ "$LISTE_HATASI" = 1 ] && hatalar+=("bekleyenler listelenemedi")
          while read -r id dil _; do
            [ -z "$id" ] && continue
            case "$id" in \#*) continue;; esac
            dil="${dil:-tr}"   # dil verilmezse Türkçe sayılır
            if [ -z "${yapilan[$dil]+x}" ]; then
              yapilan[$dil]=$(python tools/video_site.py bugun "$dil")
            fi
            if [ "${yapilan[$dil]}" -ge "$GUNLUK_EN_FAZLA" ]; then
              echo "Günlük sınır doldu ($dil: $GUNLUK_EN_FAZLA)."; continue
            fi
            echo "Üretiliyor: $id $dil"
            # </dev/null: üretim süreci döngünün okuduğu listeyi (stdin) yutmasın; yoksa sıradaki satır kaybolur.
            if python tools/video_uret.py uret --id "$id" --dil "$dil" --yukle < /dev/null; then
              yapilan[$dil]=$(( ${yapilan[$dil]} + 1 ))
            else
              echo "::error::Üretilemedi: $id $dil (sonrakine geçildi)"
              hatalar+=("$id $dil")
            fi
          done < bekleyen.txt
          if [ "${#hatalar[@]}" -gt 0 ]; then
            printf '%s\n' "${hatalar[@]}" > video-hatalari.txt
            echo "HATA: ${#hatalar[@]} iş başarısız: ${hatalar[*]}"
            exit 1
          fi

      - name: Siteyi yeniden üret ve manifesti depoya yaz
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videolar.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            # manifest değiştiyse sayfalardaki oynatıcılar ve video site haritası da güncellenir
            python tools/site_derle.py
            python tools/sosyal_derle.py
            git add -u
            git commit -m "video: üretilen videolar ve siteye işlenmesi"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
